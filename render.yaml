# Render Blueprint: New → Blueprint → pick this repo. Creates a free static
# site served from Render's CDN (it never sleeps, unlike a free web service).
services:
  - type: web
    name: pnyx-waitlist
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
